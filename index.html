<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="集中管理并快速打开 Cloudflare Workers 与 GitHub Pages 项目。" />
    <meta name="theme-color" content="#f5f3ee" />
    <title>项目索引 · Project Index</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">CHOI975 · PERSONAL LAUNCHPAD</p>
          <h1>项目索引<span aria-hidden="true">.</span></h1>
          <p class="subtitle">把散落在不同平台的作品，收进一个随时可达的入口。</p>
        </div>

        <div class="hero-stats" aria-label="项目统计">
          <div class="stat">
            <strong id="project-count">0</strong>
            <span>项目</span>
          </div>
          <div class="stat">
            <strong id="link-count">0</strong>
            <span>入口</span>
          </div>
        </div>
      </header>

      <section class="workspace" aria-labelledby="workspace-title">
        <div class="toolbar">
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" /></svg>
            <label class="sr-only" for="search">搜索项目</label>
            <input id="search" type="search" placeholder="搜索项目…" autocomplete="off" />
            <kbd>/</kbd>
          </div>

          <div class="toolbar-actions">
            <button class="button button-ghost" id="edit-button" type="button" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 4.2-1 10.4-10.4a2.1 2.1 0 0 0-3-3L5.2 16 4 20Z" /><path d="m14.5 6.5 3 3" /></svg>
              <span>编辑</span>
            </button>
            <button class="button button-primary" id="add-button" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
              <span>添加项目</span>
            </button>
          </div>
        </div>

        <h2 class="sr-only" id="workspace-title">项目列表</h2>

        <div class="project-table" role="table" aria-label="项目链接">
          <div class="table-head" role="row">
            <div role="columnheader">项目</div>
            <div role="columnheader">
              <span class="brand-dot cloudflare-dot"></span>
              Cloudflare
            </div>
            <div role="columnheader">
              <span class="brand-dot github-dot"></span>
              GitHub Pages
            </div>
          </div>
          <div id="project-list" class="table-body" role="rowgroup"></div>
        </div>

        <div id="empty-state" class="empty-state" hidden>
          <div class="empty-mark">⌁</div>
          <h3>没有找到项目</h3>
          <p>换一个关键词，或者添加一个新的项目。</p>
        </div>

        <footer class="workspace-footer">
          <p><span class="status-dot"></span>修改会自动保存在当前浏览器中</p>
          <div class="data-actions">
            <button id="import-button" type="button">导入 JSON</button>
            <button id="export-button" type="button">导出 JSON</button>
            <button id="reset-button" type="button">恢复初始项目</button>
          </div>
          <input id="import-file" type="file" accept="application/json,.json" hidden />
        </footer>
      </section>

      <p class="page-note">Made for the things worth remembering.</p>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <template id="project-row-template">
      <div class="project-row" role="row">
        <div class="project-cell project-identity" role="cell" data-label="项目">
          <div class="project-monogram" aria-hidden="true"></div>
          <div class="project-main">
            <a class="project-name" target="_blank" rel="noreferrer"></a>
            <div class="project-edit-wrap">
              <label class="sr-only">项目名称</label>
              <input class="project-input" type="text" placeholder="例如 todo" maxlength="80" spellcheck="false" />
              <p class="input-error" aria-live="polite"></p>
            </div>
            <span class="project-slug"></span>
          </div>
          <button class="delete-button" type="button" title="删除项目" aria-label="删除项目">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5" /></svg>
          </button>
        </div>

        <div class="project-cell platform-cell" role="cell" data-label="Cloudflare">
          <a class="launch-button cloudflare-button" target="_blank" rel="noreferrer">
            <span class="platform-icon cloudflare-icon" aria-hidden="true">☁</span>
            <span>打开</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9" /></svg>
          </a>
          <span class="platform-empty" aria-label="未部署">—</span>
          <label class="platform-toggle">
            <input class="cloudflare-toggle" type="checkbox" />
            <span class="toggle-track"><span></span></span>
            <span>已部署</span>
          </label>
        </div>

        <div class="project-cell platform-cell" role="cell" data-label="GitHub Pages">
          <a class="launch-button github-button" target="_blank" rel="noreferrer">
            <span class="platform-icon github-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.86c-2.78.6-3.37-1.18-3.37-1.18-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.64-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02A9.6 9.6 0 0 1 12 6.83a9.5 9.5 0 0 1 2.5.34c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.86v2.75c0 .27.18.58.69.48A10 10 0 0 0 12 2Z" /></svg>
            </span>
            <span>打开</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9" /></svg>
          </a>
          <span class="platform-empty" aria-label="未部署">—</span>
          <label class="platform-toggle">
            <input class="github-toggle" type="checkbox" />
            <span class="toggle-track"><span></span></span>
            <span>已部署</span>
          </label>
        </div>
      </div>
    </template>

    <script src="app.js" defer></script>
  </body>
</html>
